services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-room_paint_studio}
      POSTGRES_USER: ${DATABASE_USERNAME:-studio}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - studio_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 4s
      retries: 12

volumes:
  studio_db:
